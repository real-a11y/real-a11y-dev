<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sensitive names</title>
  </head>
  <body>
    <!--
      Chromium names a node from its contents, and an embedded field's value
      is part of them. Each sensitive card field below would otherwise put the
      card number into a name that isn't its own (ADR-0001). The plain fields
      are the controls: a value that isn't sensitive still names its cell, and
      an empty card field gives nothing away, so its label stays.
    -->
    <label
      ><input type="checkbox" /> Save card
      <input autocomplete="cc-number" value="4111111111111111"
    /></label>

    <table>
      <tr>
        <td>Card</td>
        <td><input autocomplete="cc-number" value="5555444433332222" /></td>
      </tr>
      <tr>
        <td>Notes</td>
        <td><input value="leave at door" /></td>
      </tr>
    </table>

    <label
      ><input type="checkbox" /> Remember
      <input autocomplete="cc-number" value=""
    /></label>

    <input id="pin" type="password" value="hunter2xyz" />
    <button aria-describedby="pin">Show</button>
    <div role="group" aria-labelledby="pin">Group</div>
  </body>
</html>
