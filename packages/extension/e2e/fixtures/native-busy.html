<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native busy state</title>
  </head>
  <body>
    <!--
      Chromium sends `aria-busy="true"` over CDP as the number 1 under a
      boolean type, where every other boolean state is a JSON boolean. For
      panel-ui-native.test.ts's busy-badge case.
    -->
    <h1>Busy region</h1>
    <section aria-label="Results" aria-busy="true">
      <p>Loading…</p>
    </section>
  </body>
</html>
