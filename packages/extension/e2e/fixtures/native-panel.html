<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native panel — production UI fixture</title>
  </head>
  <body>
    <h1>Native panel fixture</h1>

    <!--
      Exercises two production-side-panel-only paths that no other committed
      e2e suite touches — everything else in e2e/ drives the message channel
      or the dev-only DogfoodPanel widget, never NativeTreeView.tsx or
      App.tsx's handleNativeActivate. Both bugs below were real, caught only
      by review, not by any test:

      1. NativeTreeView's virtualization (useVirtualTree's containerRef was
         never wired to the scrollable container) — silently capped the tree
         at ~10 rendered rows and made scrollToIndex a permanent no-op,
         regardless of how many nodes the tree actually had. 16 flat buttons,
         nested one level under the section below (so "Expand all" is
         required to reveal them), comfortably exceeds that fallback window.
      2. A native field whose value is redacted (see the password input)
         must never show its real value in the retype UI, and the retype
         must be masked like a DOM password field.
    -->

    <!--
      A plain, non-semantic <div> with an accessible name — Chromium's own
      tree normalizes this to a NAMED `generic` group (see
      `ax-normalize.ts`'s comment on `generic`: bare/unnamed ones are
      dropped as noise, but a named one is kept as a meaningful labelled
      container, e.g. a media-player wrapper). Exercises Copy/export's
      `includeGeneric: true` for native trees — without it, this whole
      group (and its label) silently vanishes from the exported report
      even though the panel itself still shows it.
    -->
    <div aria-label="Sensitive field group">
      <h2>Sensitive field</h2>
      <label for="pw">Password</label>
      <input
        id="pw"
        type="password"
        value="hunter2"
        autocomplete="current-password"
      />
    </div>

    <!--
      Nothing follows this section in the DOM — Item 16 must be the actual
      last node in the whole page's accessible tree, not just the last child
      of its own section, so pressing End lands on it rather than on some
      later, unrelated node.
    -->
    <section aria-label="Items">
      <!--
        Item 1's text sits in its own inner <span>, unlike every other item
        here — a DOM element with no accessible role or name of its own, so
        Chromium's AX tree prunes it and keeps only the enclosing <button>.
        Exercises the native picker's ancestor-fallback: clicking exactly on
        this span hits a backendNodeId no native tree row was ever built
        from, and the picker has to walk up to the button to resolve
        anything at all.
      -->
      <button id="item-1"><span class="item-1-inner">Item 1</span></button>
      <button id="item-2">Item 2</button>
      <button id="item-3">Item 3</button>
      <button id="item-4">Item 4</button>
      <button id="item-5">Item 5</button>
      <button id="item-6">Item 6</button>
      <button id="item-7">Item 7</button>
      <button id="item-8">Item 8</button>
      <button id="item-9">Item 9</button>
      <button id="item-10">Item 10</button>
      <button id="item-11">Item 11</button>
      <button id="item-12">Item 12</button>
      <button id="item-13">Item 13</button>
      <button id="item-14">Item 14</button>
      <button id="item-15">Item 15</button>
      <button id="item-16">Item 16</button>
    </section>

    <script>
      // A `data-` flag on the button itself, not a trailing `<output>` —
      // anything after the section would become the tree's real last node
      // instead of Item 16.
      document.getElementById("item-16").addEventListener("click", (e) => {
        e.currentTarget.dataset.clicked = "true";
      });
    </script>
  </body>
</html>
