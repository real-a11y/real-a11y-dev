  <head>

    <title>Native nav — real link</title>

  <body>

      A genuine, un-prevented <a href> — unlike tree-view.html's Bookmarks

      tree, for panel-ui-native.test.ts's own navigation-re-read case.
    -->

    <p><a href="tree-view.html">Go to tree view</a></p>
  </body>
