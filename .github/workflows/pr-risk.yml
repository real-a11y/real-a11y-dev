name: PR risk

# What this PR is risking, computed from its diff — the tier from
# `scripts/pr-risk.mjs`, applied as a `risk:*` label and a sticky comment.
#
# Unlike `docs-currency`, this one BLOCKS: a high-risk change with no recorded
# deep review fails the job. That is the whole point of it being a required
# check — the `pr` skill's §0 review depth is otherwise a rule that only applies
# when someone remembers it, which for the failure modes in the high tier
# (publishing to npm, weakening CODEOWNERS, removing a public export) is the same
# as not applying.
#
# ---------------------------------------------------------------------------
# THE RUBRIC COMES FROM THE BASE BRANCH. This is the single most important line
# in the file.
#
# `actions/checkout` lands the MERGE ref — which contains the pull request's
# changes. So `node scripts/pr-risk.mjs` out of the workspace is the PR's own
# copy of the rubric, and a six-line stub printing `{"tier":"low"}` clears its
# own required check. Reproduced end-to-end alongside an exfiltrating
# `publish.yml` edit, and it works from forks too, because the gate needs no
# token to lie.
#
# It is also the second-order version of the same problem: executing PR-authored
# code inside a job holding `pull-requests: write`.
#
# So the grader is extracted from `origin/$BASE_REF` into RUNNER_TEMP and run
# from there, with `--repo` pointing at the workspace it is grading. The whole
# `scripts/` tree is taken rather than the one file, so the rubric's imports
# (`surface/plan/diff.mjs`) resolve from the base branch as well — no per-file
# list here to drift out of sync with the imports over there.
#
# The consequence, which is correct and worth stating: a PR that ADDS a rule is
# graded without it. New rules take effect once they land on the base branch,
# after a human has reviewed them.
#
# What this does NOT cover is this file. `pull_request` takes the workflow
# definition from the merge ref as well — that is how the bootstrap branch below
# ever ran — so a PR that edits pr-risk.yml runs its own edit. That case is
# human review's job, and `.github/workflows` grades 🔴 high so that it gets one.
# ---------------------------------------------------------------------------
# STACKED PULL REQUESTS: the rubric from the trunk, the diff against the parent.
#
# GitHub runs a stacked PR's workflows "as if it targets the base of the stack".
# For every layer above the bottom, `github.base_ref` is therefore the TRUNK —
# `main`, which is why `branches: [main]` matches at all — while
# `github.event.pull_request.base.ref`, like the REST `pulls/{n}` base, is the
# PARENT: the branch directly below. Grading against `github.base_ref` made every
# upper layer inherit the tier of every layer under it: one e2e test file stacked
# on a size-limit bump graded 🔴 high.
#
# So the two refs do different jobs:
#
#   - The RUBRIC still comes from the trunk. The parent is an unmerged pull
#     request — PR-authored, unreviewed — and taking the grader from it is the
#     hole above, one layer removed: a lower layer that stubs pr-risk.mjs would
#     clear every layer stacked on it, from inside a job holding
#     `pull-requests: write`. A layer stacked on a rubric change is graded
#     without that change, exactly like the rubric change itself.
#   - The DIFF is the layer's own: its head commit against the parent, the same
#     diff `pnpm pr:risk --base origin/<parent>` reads on that branch. Not the
#     merge ref: a stacked layer's merge ref is built on the merge ref of the
#     layer below, i.e. on main plus every lower layer, so against the parent it
#     also counts whatever main gained since the stack was last rebased — the
#     "merely behind reads as high" problem, back again.
#
# One over-count remains, and it is the honest one: a layer whose parent was
# rebased without restacking it shares only the stack's fork point with the
# parent, so its diff counts the parent's commits too until the stack is
# restacked — which GitHub demands before it will merge anyway.
#
# Grading a layer alone does not wave the layers below it through. Merging a
# stacked PR lands every unmerged PR below it, and GitHub first requires each of
# them to pass its own required checks — this one among them. The report says so
# on every stacked PR, because each label now covers one layer's diff.
#
# An unstacked PR, and the bottom of a stack, has the two refs equal and takes
# exactly the path it always took. Anything unexpected — a parent that differs
# with no stack to explain it, a name outside the safe set, a parent commit
# that can't be fetched any more — is graded against the trunk with a warning,
# the old answer: it over-counts, never under-counts.
# ---------------------------------------------------------------------------
#
# Two more things follow from being REQUIRED, and both are easy to get wrong:
#
#   1. NO `paths:` FILTER. A required check that doesn't run never reports, and
#      GitHub blocks the PR forever waiting for it. Every path filter you would
#      want here is already expressed inside the rubric.
#   2. It has to run cheaply on every PR — so, like `surface plan`, the script
#      is node-core + git only and this job deliberately skips `pnpm install`.
#      Adding an import of anything installed breaks it with ERR_MODULE_NOT_FOUND
#      on every run.

on:
  pull_request:
    # A stacked PR matches through its stack's base, not its own — see
    # STACKED PULL REQUESTS above.
    branches: [main]
    # `edited` because the title and body feed the rubric (a `!` title, a
    # `BREAKING CHANGE` body, the `risk-override:` reason). `labeled`/`unlabeled`
    # because `reviewed:deep` and `risk-override` are how a red gate goes green,
    # and without these the label would sit there while the check stayed failed.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # apply the risk label + post the sticky comment

# One run per pull request at a time, and the newest event wins: it cancels the
# run in flight rather than queueing behind it, so the `labeled` run that a
# `reviewed:deep` triggers is never stuck behind a stale one.
#
# What this cannot do is make a run's view of the PR current. The event payload,
# labels included, is a snapshot taken when the event fired, and a run keeps it
# however late it starts — a re-run reuses it outright. Force-pushing a stack
# fires `synchronize` on a layer twice, a second apart (its head moved, and so
# did its base), and both payloads list the labels from before either run
# touched them; the second run, whether it follows the first or cancels it
# part-way, starts from labels already changed under it. Hence the label writes
# below treat "already done" as done, the risk label is reconciled against the
# PR's live labels, and the Gate never counts a review label out of a
# `synchronize` payload.
concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The rubric is computed against the merge base, so it needs both
          # sides of history. A shallow clone reports "no common ancestor".
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Runs FIRST, before anything can grade the diff: a review recorded
      # against one tree must not carry over to a different one.
      #
      # The old sweep was `startsWith('risk:')`, which matches neither
      # `reviewed:deep` (starts `reviewed:`) nor `risk-override` (starts
      # `risk-`). So a maintainer could approve a `feat!:` PR, the author could
      # force-push a tree adding `curl $NPM_TOKEN` to publish.yml, and the
      # `synchronize` run would recompute `tier: high`, say so in the comment,
      # and still exit 0. This is the label analogue of `dismiss_stale_reviews`.
      #
      # Taking the labels off the PR is what every event after this one sees.
      # This run's own Gate reads the payload, which still lists them, so it
      # refuses them on `synchronize` itself — see the Gate.
      - name: Drop stale review labels on a new head
        if: >-
          github.event.action == 'synchronize' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // The payload's labels on purpose, unlike the risk label below: they
            // are the ones that were on the PR when the head moved, so every one
            // of them predates it. The live list would also sweep a review
            // applied AFTER the push, to this very head, whenever this run
            // started late.
            const present = (context.payload.pull_request.labels || []).map((l) => l.name);
            for (const name of ['reviewed:deep', 'risk-override']) {
              if (!present.includes(name)) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                console.log(`Removed ${name} — the head changed, so the review is owed again.`);
              } catch (error) {
                // 404 is "not on the PR": something removed it first, usually
                // the other `synchronize` run for this head — see `concurrency`
                // above. Gone is the point.
                if (error.status !== 404) throw error;
                console.log(`${name} was already removed — the head changed, so the review is owed again.`);
              }
            }

      - name: Classify
        id: classify
        env:
          # Via the environment, never `${{ }}` interpolated into the script
          # body: a PR title is attacker-controlled text, and interpolation makes
          # it shell. This is the single most common Actions injection. A branch
          # name is author-chosen text too, so the parent arrives the same way.
          BASE_REF: ${{ github.base_ref }}
          # Only differ from the above for a layer of a stack — see the header.
          # From the event payload rather than a REST read: the parent's tip
          # and the head graded against it are one snapshot, and no API call
          # sits in a required check's path.
          PARENT_REF: ${{ github.event.pull_request.base.ref }}
          PARENT_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position }}
          STACK_SIZE: ${{ github.event.pull_request.stack.size }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Explicit refspec: actions/checkout leaves a narrow one behind, so a
          # bare `git fetch origin <branch>` can update FETCH_HEAD without ever
          # creating refs/remotes/origin/<branch> — which is the ref the script
          # resolves. It refuses to run rather than guess, so this must be exact.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          # The grader, from the BASE branch — the trunk, for a stacked PR too.
          # See the header.
          mkdir -p "$RUNNER_TEMP/base"
          git archive "origin/$BASE_REF" scripts | tar -x -C "$RUNNER_TEMP/base"
          RUBRIC="$RUNNER_TEMP/base/scripts/pr-risk.mjs"

          # BOOTSTRAP ONLY. Before this lands, `origin/main` has no rubric to
          # grade with, so the very PR introducing the check could never pass it.
          #
          # Falling back to the PR's copy is the thing the header forbids, so be
          # precise about why it is safe here and nowhere else: this workflow runs
          # only on PRs targeting `main`, and the branch is reachable only while
          # `main` lacks the file. A pull request cannot remove it from `main`
          # without first being merged — which is the review this is protecting.
          # So it fires exactly once, on the PR you are reading, and is dead
          # afterwards.
          #
          # It warns loudly rather than passing quietly, because a fallback that
          # looks like a normal run is how "temporary" becomes permanent.
          if [ ! -f "$RUBRIC" ]; then
            if [ -f "$GITHUB_WORKSPACE/scripts/pr-risk.mjs" ]; then
              echo "::warning::origin/$BASE_REF has no rubric yet — grading with the PR's own copy (bootstrap). This is NOT a trustworthy grade: once the rubric is on $BASE_REF this path is unreachable and the gate becomes real."
              RUBRIC="$GITHUB_WORKSPACE/scripts/pr-risk.mjs"
            else
              echo "::error::no rubric on origin/$BASE_REF and none in the PR"
              exit 1
            fi
          fi
          echo "rubric=$RUBRIC" >> "$GITHUB_OUTPUT"

          # What the diff is measured against: the trunk, unless this PR is a
          # layer of a stack — see STACKED PULL REQUESTS in the header. Every
          # guard falls back to the trunk, the old over-counting answer, rather
          # than failing the required check: a re-run reuses the event, so a
          # red check here could never be cleared by re-running it.
          #
          # The name is checked before it is printed or passed anywhere. It is
          # author-chosen, git allows `$`, backticks and `<` in it, and it lands
          # in the sticky comment below.
          DIFF_REF="$BASE_REF"
          STACKED=""
          if [ "$PARENT_REF" != "$BASE_REF" ]; then
            if ! [[ "$PARENT_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::warning::This PR's base branch name has characters outside [A-Za-z0-9._/-], so it is graded against $BASE_REF instead — which counts every layer below it too."
            elif [ "$STACK_BASE_REF" != "$BASE_REF" ]; then
              echo "::warning::This PR's base is $PARENT_REF, not $BASE_REF, but it reports no stack on $BASE_REF — graded against $BASE_REF, which can over-count."
            elif ! [[ "$STACK_POSITION" =~ ^[0-9]+$ && "$STACK_SIZE" =~ ^[0-9]+$ &&
                      "$HEAD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ &&
                      "$PARENT_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "::warning::Stack metadata is malformed — graded against $BASE_REF, which counts every layer below this one too."
            elif ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
              echo "::warning::The event's head $HEAD_SHA isn't in the checked-out merge ref — graded against $BASE_REF, which counts every layer below this one too."
            # The parent as the EVENT saw it, not the branch's tip now: a parent
            # rebased since the event would otherwise be diffed against the
            # wrong head. It is normally here already — the merge ref is built
            # on it and checkout fetched every branch — so the remote is asked
            # only when it isn't. A commit nobody can fetch any more (parent
            # squash-merged and deleted, or force-pushed away) is graded
            # against the trunk, never against some other parent.
            elif ! { git cat-file -e "$PARENT_SHA^{commit}" 2>/dev/null ||
                     git fetch --no-tags --quiet origin "$PARENT_SHA"; }; then
              echo "::warning::The parent this event names ($PARENT_REF at $PARENT_SHA) can't be fetched any more — graded against $BASE_REF, which counts every layer below this one too."
            else
              # Named like a branch so the report reads `origin/<parent>`.
              git update-ref "refs/remotes/origin/$PARENT_REF" "$PARENT_SHA"
              # The layer's head rather than the merge ref — see the header.
              # Detached in the workspace itself, so the Gate step grades the
              # very same tree.
              git checkout --quiet --detach "$HEAD_SHA"
              DIFF_REF="$PARENT_REF"
              STACKED=1
              echo "Stacked: layer $STACK_POSITION of $STACK_SIZE on $BASE_REF. Grading $HEAD_SHA against origin/$PARENT_REF, with the rubric from origin/$BASE_REF."
            fi
          fi
          echo "diff_ref=$DIFF_REF" >> "$GITHUB_OUTPUT"

          run_rubric() {
            node "$RUBRIC" --repo "$GITHUB_WORKSPACE" --base "origin/$DIFF_REF" \
              --title "$PR_TITLE" --body "$PR_BODY" "$@"
          }

          run_rubric --format json > "$RUNNER_TEMP/risk.json"
          run_rubric --format markdown > "$RUNNER_TEMP/risk.md"
          cat "$RUNNER_TEMP/risk.json"

          # Each label now covers one layer, but merging a layer merges every
          # unmerged PR below it — so the comment people decide a merge from has
          # to say that, and how to reproduce this grade locally.
          if [ -n "$STACKED" ]; then
            printf '\n> **Stacked PR, layer %s of %s on `%s`.** Graded against its parent, `%s`, so this tier covers this layer alone; `pnpm pr:risk --base origin/%s` reproduces it, where plain `pnpm pr:risk` grades against `%s`. Merging this PR also merges every unmerged pull request below it, each under its own `risk:*` label, so that merge is as risky as the highest of them.\n' \
              "$STACK_POSITION" "$STACK_SIZE" "$BASE_REF" "$PARENT_REF" "$PARENT_REF" "$BASE_REF" >> "$RUNNER_TEMP/risk.md"
          fi

          # Validated, not trusted. `echo "x=$(cmd)"` does NOT abort under
          # `set -e` when the substitution fails — the `echo` succeeds — so a
          # broken `node -p` used to write an empty tier, and the labelling step
          # then stripped the PR's accurate `risk:high` and applied a bare
          # `risk:`. Silently downgrading a label is the worst available failure.
          TIER="$(node -p "require('$RUNNER_TEMP/risk.json').tier")"
          case "$TIER" in
            low|medium|high) ;;
            *) echo "::error::rubric produced no usable tier (got '$TIER')"; exit 1 ;;
          esac
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

      # Forks get a read-only token even with `pull-requests: write` above, so
      # labelling would throw. The gate below still runs — that is the part that
      # has to be trustworthy — and a maintainer labelling the PR re-triggers
      # this workflow through the `labeled` event.
      - name: Label and report
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- pr-risk -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const tier = '${{ steps.classify.outputs.tier }}';
            if (!['low', 'medium', 'high'].includes(tier)) {
              throw new Error(`refusing to label with tier '${tier}'`);
            }

            // Created on demand rather than assumed to exist, so the check works
            // on a fresh clone of this repo with no label setup.
            const SPEC = {
              'risk:low': ['0e8a16', 'Diff touches nothing the rubric grades — an agent may merge it when green'],
              'risk:medium': ['fbca04', 'Published source, public surface, dependencies, or a path the rubric does not recognise'],
              'risk:high': ['b60205', 'Publish, policy, packaging or breaking change — full review, human merges'],
              'reviewed:deep': ['1d76db', 'Deep review recorded at the current head; dropped automatically on a new push'],
              'risk-override': ['5319e7', 'A risk rule fired on something inert; the reason is in the description'],
            };
            for (const [name, [color, description]] of Object.entries(SPEC)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                // 422 is "already exists", which is the normal case.
                if (error.status !== 422) throw error;
              }
            }

            // Only ever touch the risk:<tier> labels. Anything else on the PR is
            // somebody's deliberate triage and is none of this job's business —
            // the two gate labels are handled by their own step above, on the
            // one event where they go stale.
            //
            // Read live, NOT from the payload. That is a snapshot from when the
            // event fired, and another run for this PR may have relabelled it
            // since — see `concurrency` above. Reconciling against the snapshot
            // 404s on a label that run already swapped out, and, worse, skips
            // adding `want` because the snapshot still lists it, which leaves
            // the PR wearing the other run's tier: a silent downgrade whenever
            // that run graded lower.
            const want = `risk:${tier}`;
            const current = (
              await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner, repo, issue_number, per_page: 100,
              })
            ).map((l) => l.name);
            for (const name of current.filter((l) => /^risk:(low|medium|high)$/.test(l) && l !== want)) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                // 404 is "not on the PR" — removed between the read above and
                // here. Gone is the point.
                if (error.status !== 404) throw error;
              }
            }
            if (!current.includes(want)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [want] });
            }

            // Sticky comment: marker as the FIRST line AND our bot, so it can
            // never adopt a human's comment that happens to quote the marker.
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/risk.md`, 'utf8');
            const body = `${MARKER}\n${report.trim()}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(MARKER),
            );

            if (!mine) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              console.log('Risk comment posted.');
            } else if (mine.body?.trim() !== body.trim()) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              console.log('Risk comment updated.');
            } else {
              console.log('Risk comment already current — no write.');
            }

      # Last, so the label and the comment are already in place when it fails —
      # a red X whose explanation posts afterwards reads as "your PR is broken".
      - name: Gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVENT_ACTION: ${{ github.event.action }}
          RUBRIC: ${{ steps.classify.outputs.rubric }}
          # The trunk, or a stacked layer's parent — whichever Classify graded.
          DIFF_REF: ${{ steps.classify.outputs.diff_ref }}
        run: |
          set -euo pipefail

          # A new head owes its review again, so on `synchronize` neither gate
          # label counts. The first step took them off the PR, but LABELS is
          # the payload, snapshotted at the push, and still lists them — read
          # as-is, it let a new head keep the green gate the previous one
          # earned, the exact failure that step was written to stop. On a fork
          # nothing removes them at all, since the token is read-only. A label
          # applied after the push arrives in a `labeled` event, which counts.
          if [ "$EVENT_ACTION" = synchronize ]; then
            LABELS=",$LABELS,"
            for stale in reviewed:deep risk-override; do
              case "$LABELS" in
                *",$stale,"*)
                  echo "::notice::Not counting $stale — it was applied before this push, so it describes the previous head. Apply it again once this head is reviewed (remove it first if it is still on the PR)."
                  LABELS="${LABELS//,$stale,/,}"
                  ;;
              esac
            done
          fi

          # The override is honoured BEFORE the rubric runs, not passed to it.
          # This check is required, so a bug in the rubric would otherwise block
          # every PR in the repo with no way out — including the PR that fixes
          # the bug. Checking the label here means the escape hatch still works
          # when the thing it is escaping is what's broken.
          #
          # It still demands a written reason, because the comment claims the
          # override is "recorded, not silent" and a label alone is neither.
          case ",$LABELS," in
            *,risk-override,*)
              if ! printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*risk-override:[[:space:]]*[^[:space:]]'; then
                echo "::error::risk-override is set, but the description has no 'risk-override: <reason>' line."
                exit 1
              fi
              echo "risk-override accepted — reason is on the PR."
              exit 0
              ;;
          esac

          args=""
          case ",$LABELS," in *,reviewed:deep,*) args="--reviewed" ;; esac

          # Same rubric the Classify step resolved, bootstrap fallback included,
          # against the same base and the same tree — for a stacked layer that
          # is still the detached head Classify left behind.
          node "$RUBRIC" \
            --repo "$GITHUB_WORKSPACE" --base "origin/$DIFF_REF" \
            --title "$PR_TITLE" --body "$PR_BODY" --gate $args
