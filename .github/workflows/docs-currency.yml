name: Docs currency

# Advisory backstop for the `pr` skill's docs step. It posts ONE sticky comment
# saying what this PR's public-surface changes oblige you to update — the docs
# from §4, the test scenarios from §4b — and clears it when there's nothing to
# say. It never fails, so it can't block a legitimate internal refactor;
# escalate to a required check via branch protection only if you want it to gate.
#
# The report is computed from the `docs/surface.json` diff, not from which files
# the PR touched, so "you renamed a flag" is a fact rather than an inference.
# That also makes this job cheap: two commits of one JSON file and `git diff
# --name-only`, so no pnpm install, no build, no browser.
#
# It can trust the manifest because `surface:check` (in the verify job) fails
# when it's stale — so on any PR that passes CI, the manifest describes the
# branch's real surface.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths:
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "docs/surface.json"

permissions:
  contents: read
  pull-requests: write # post/update the sticky comment

concurrency:
  group: docs-currency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `plan` needs the merge base, so it needs both sides of history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compute the surface plan
        id: plan
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/surface/index.mjs plan \
            --base "origin/$BASE_REF" --format markdown > plan.md
          # `changeset status` is unavailable without an install, so the version
          # stamps degrade to "no pending changeset" — the obligations, which
          # are the point, do not depend on it.
          cat plan.md
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- docs-currency -->';
            const { owner, repo } = context.repo;
            const pr = context.issue.number;

            // Opt-out: the `no-docs-needed` label, or `docs-check: n/a` in the body.
            const labels = (context.payload.pull_request.labels || []).map((l) => l.name);
            const body = context.payload.pull_request.body || '';
            const optedOut =
              labels.includes('no-docs-needed') ||
              /docs-check:\s*(n\/?a|skip|none)/i.test(body);

            const report = fs.readFileSync('plan.md', 'utf8').trim();
            const nothingToSay = report.includes('No public-surface changes');

            // Find our existing sticky comment (marker as FIRST line AND our bot).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr,
              per_page: 100,
            });
            const mine = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                c.body?.startsWith(MARKER),
            );

            const cleared = [
              MARKER,
              '### ✅ Docs check',
              '',
              optedOut
                ? 'Marked as no docs needed for this change.'
                : 'No public-surface changes on this PR — nothing for §4 or §4b to ask.',
            ].join('\n');

            const full = [
              MARKER,
              report,
              '',
              '_Advisory — this check never blocks the merge. Internal-only change with nothing to document? Put `docs-check: n/a` in the description (or add a `no-docs-needed` label) and this note clears._',
              '',
              'Full map and the a11y-baseline regen step: the `pr` skill (`.claude/skills/pr/SKILL.md`). Run it yourself with `pnpm surface:plan`.',
            ].join('\n');

            const desired = nothingToSay || optedOut ? cleared : full;

            if (mine) {
              if (mine.body?.trim() === desired.trim()) {
                console.log('Sticky comment already current — no write.');
                return;
              }
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: mine.id,
                body: desired,
              });
              console.log('Sticky comment updated.');
            } else if (!nothingToSay && !optedOut) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body: desired,
              });
              console.log('Sticky comment posted.');
            } else {
              console.log('Nothing to say and no existing comment — no action.');
            }
